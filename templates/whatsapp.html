{% extends 'base.html' %}

{% block content %}

<script src="{{ url_for('static', filename='js/whatsapp.js') }}"></script>

<div class="main-project-container">
    <div class="project-container">
        <h1 data-translate-key="whatsapp_title">{{ texts['whatsapp_title'] }}</h1>

        {% if error %}
        <div class="error-message"
            style="color: red; background-color: #ffe0e0; border: 1px solid red; padding: 10px; margin-bottom: 15px; border-radius: 5px;">
            {{ error }}
        </div>
        {% endif %}

        <div>
            <p id="intro-paragraph" data-translate-key="instruction">{{ texts['instruction'] }}</p>
        </div>

        <div class="upload-form">
            <form class="project-form" action="/whatsapp_dashboard" method="post" enctype="multipart/form-data">

                <div class="form-group">
                    <label for="file" data-translate-key="first_step">{{ texts['first_step'] }}</label><br>
                    <input type="file" id="file" name="file" accept=".txt">
                    <span id="fileError" style="color: red;"></span>
                </div>

                <div class="form-group">
                    <label for="language" data-translate-key="second_step">{{ texts['second_step'] }}</label>
                    <select id="language" name="language"
                        title="Select the language in which the conversation was hold"></select>
                </div>

                <input type="hidden" id="selected_language" name="selected_language">

                <div class="button-row">
                    <button type="submit" data-translate-key="button">{{ texts['button'] }}</button>
                </div>
            </form>
        </div>
    </div>
</div>


{% endblock %}
