{% extends 'base.html' %}

{% block content %}

<!-- WhatsApp Functionality Template -->

<div class="main-project-container">
    <div class="project-container">
        <h1>WhatsApp</h1>
        <div>
            <p id="intro-paragraph">Upload the WhatsApp text file you want to analyze.</p>
        </div>

        <div class="upload-form">
            <form class="project-form" action="/whatsapp_dashboard" method="post" enctype="multipart/form-data">

                <div class="form-group">
                    <label for="file">Upload Your WhatsApp Conversation:</label><br>
                    <input type="file" id="file" name="file" accept=".txt">
                    <span id="fileError" style="color: red;"></span>
                </div>

                <div class="form-group">
                    <label for="language">Select Language:</label>
                    <select id="language" name="language" title="Select the language in which the conversation was hold"></select>
                </div>

                <input type="hidden" id="selected_language" name="selected_language">

                <div class="button-row">
                    <button type="submit">Analyze <br>Chat</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/whatsapp.js') }}"></script>

{% endblock %}
