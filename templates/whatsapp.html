{% extends 'base.html' %}

{% block content %}

<div class="project-container">
    <!-- Title and Introduction Section -->
    <h1 class="project-title">WhatsApp</h1>

<div class="project-container">
    <!-- Upload Form Section -->
    <div class="upload-form">
        <form id="project-form" class="project-form" action="/whatsapp" method="post" enctype="multipart/form-data">
            <label for="file">Upload WhatsApp chat (only .txt files allowed):</label><br>
            <input type="file" id="file" name="file" accept=".txt"><br>
            <span id="fileError" style="color: red;"></span><br>

            <!-- Container for the text "Select Language" -->
            <div class="language-container">
                <label for="language">Select Language:</label>
            </div>

            <!-- Language dropdown menu -->
            <div class="select-language-container">
                <select id="language" name="language"></select>
            </div>
            <input type="hidden" id="selected_language" name="selected_language">
            <br><br>
            <button type="submit" class="show-results">Analyze Chat</button>
        </form>
    </div>
</div>

<style>
    .language-container {
        display: inline-block;
        width: 140px;
        text-align: right;
        margin-right: 10px;
    }

    .select-language-container {
        display: inline-block;
        width: calc(100% - 160px);
        vertical-align: center;
        position: relative;
        top: 0px;
        left: 10px;
        padding: 0px;
    }

    .upload-form .show-results {
        position: absolute;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: #3498db;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    #file {
        margin-bottom: 0px;
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const languages = [
            { value: "english", text: "English" },
            { value: "mandarin", text: "Mandarin" },
            { value: "spanish", text: "Spanish" },
            { value: "french", text: "French" },
            { value: "arabic", text: "Arabic" },
            { value: "bengali", text: "Bengali" },
            { value: "portuguese", text: "Portuguese" },
            { value: "russian", text: "Russian" },
            { value: "japanese", text: "Japanese" },
            { value: "punjabi", text: "Punjabi" },
            { value: "german", text: "German" },
            { value: "javanese", text: "Javanese" },
            { value: "korean", text: "Korean" },
            { value: "vietnamese", text: "Vietnamese" },
            { value: "telugu", text: "Telugu" }
        ];

        const selectElement = document.getElementById('language');
        const hiddenInput = document.getElementById('selected_language');

        languages.forEach(function (language) {
            const option = document.createElement('option');
            option.value = language.value;
            option.textContent = language.text;
            selectElement.appendChild(option);
        });

        // Establece el valor seleccionado por defecto
        selectElement.value = "english";  // Ajusta esto según el idioma predeterminado
        hiddenInput.value = selectElement.value;

        selectElement.addEventListener('change', function () {
            hiddenInput.value = selectElement.value;
        });
    });

    const form = document.getElementById('project-form');
    form.addEventListener('submit', function (event) {
        event.preventDefault();

        const fileInput = document.getElementById('file');
        const fileError = document.getElementById('fileError');

        fileError.textContent = '';
        let isValid = true;

        if (!fileInput.files.length) {
            fileError.textContent = 'Please select a file.';
            isValid = false;
        }

        if (isValid) {
            this.submit();
        }
    });
</script>

{% endblock %}
